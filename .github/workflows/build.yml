name: Build AliothX Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - aosp-16

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: aosp-16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            gnupg gperf libelf-dev libncurses5-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip libtinfo5 libncurses5 gcc-aarch64-linux-gnu
          which python2 || sudo ln -s $(which python3) /usr/bin/python2

      - name: Clone Clang Toolchain (r563880c)
        run: |
          echo "Cloning AOSP Clang r563880c..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r563880c.git clang
          chmod -R +x clang/bin/

      - name: Setup mkdtboimg
        run: |
          chmod +x scripts/ufdt/libufdt/utils/src/mkdtboimg.py
          sudo ln -sf $(pwd)/scripts/ufdt/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtboimg.py

      - name: Compile Kernel
        run: |
          mkdir -p out
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== Configuring alioth_defconfig ==="
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 alioth_defconfig

          echo "=== Building Kernel Image, DTBs and DTBO ==="
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 Image dtbs dtbo.img

      - name: Verify Build Output
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi
          echo "Kernel compiled successfully!"
          ls -lh out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/dtbo.img || true

      - name: Package with AnyKernel3
        run: |
          cp -r anykernel ak
          cp out/arch/arm64/boot/Image ak/Image
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img ak/dtbo.img
          fi
           cat out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb > ak/dtb 2>/dev/null || true

          # KernelSU-Next is built into the kernel (CONFIG_KSU=y). No separate
          # su binary is needed; root is managed by the KernelSU Manager app.

          DATE_TAG=$(date +'%Y%m%d-%H%M')
          ZIP_NAME="AliothX-DroidSpaces-alioth-${DATE_TAG}.zip"
          (cd ak && zip -r9 "../${ZIP_NAME}" . -x '*.git*')
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV
          ls -lh "${ZIP_NAME}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AliothX-${{ env.DATE_TAG }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/aosp-16') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ env.DATE_TAG }}
          name: AliothX DroidSpaces (${{ env.DATE_TAG }})
          body: |
            ### AliothX Kernel — POCO F3 / Redmi K40 (alioth)
            - **SoC**: Qualcomm Snapdragon 870 5G (SM8250-AC)
            - **Base**: Linux 4.19.325 (AOSP 16 / Android 16)
            - **Escalonador**: EEVDF (Earliest Eligible Virtual Deadline First) + CASS
            - **Root**: KernelSU-Next v3.2.0-legacy (magic mount + app profile)
            - **Features**: ZSTD 1.5.7, DroidSpaces (namespaces/containers), GPU Reset Recovery, GDSC 500us Timeout
            - **Compiler**: Clang r563880c (LLVM 21+) com ThinLTO, PGO, BOLT, MLGO
            
            #### Instalação Universal:
            - **`${{ env.ZIP_NAME }}`**: Pacote AnyKernel3 universal para instalação via Recovery (TWRP / OrangeFox) ou Kernel Flasher.
            - Detecta e adapta-se automaticamente a **Header v2 e Header v3** em qualquer ROM (LineageOS, EvolutionX, crDroid, PixelOS, etc.).
            - Para gerenciar o root, instale o **KernelSU-Next Manager** (https://github.com/KernelSU-Next/KernelSU-Next/releases).
          files: |
            ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
