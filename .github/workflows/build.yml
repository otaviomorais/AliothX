name: Build AliothX Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - aosp-16

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: aosp-16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            gnupg gperf libelf-dev libncurses5-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip libtinfo5 libncurses5
          which python2 || sudo ln -s $(which python3) /usr/bin/python2

      - name: Clone Clang Toolchain (r563880c)
        run: |
          echo "Cloning AOSP Clang r563880c..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r563880c.git clang
          chmod -R +x clang/bin/

      - name: Setup mkdtboimg
        run: |
          chmod +x scripts/ufdt/libufdt/utils/src/mkdtboimg.py
          sudo ln -sf $(pwd)/scripts/ufdt/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtboimg.py

      - name: Setup magiskboot
        run: |
          echo "Downloading magiskboot..."
          curl -sSL -o Magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
          unzip -j Magisk.apk lib/x86_64/libmagiskboot.so -d /tmp/
          sudo mv /tmp/libmagiskboot.so /usr/local/bin/magiskboot
          sudo chmod +x /usr/local/bin/magiskboot
          rm -f Magisk.apk
          magiskboot --help || true

      - name: Apply SUSFS 4.19 Patches
        run: |
          echo "=== Setting up SUSFS for Linux 4.19 ==="
          sudo apt-get install -y patch
          curl -sSL -o 50_add_susfs_in_kernel-4.19.patch https://gitlab.com/PuceLi/susfs4ksu/-/raw/kernel-4.19/kernel_patches/50_add_susfs_in_kernel-4.19.patch
          curl -sSL --create-dirs -o fs/susfs.c https://gitlab.com/PuceLi/susfs4ksu/-/raw/kernel-4.19/kernel_patches/fs/susfs.c
          curl -sSL --create-dirs -o include/linux/susfs.h https://gitlab.com/PuceLi/susfs4ksu/-/raw/kernel-4.19/kernel_patches/include/linux/susfs.h
          curl -sSL --create-dirs -o include/linux/susfs_def.h https://gitlab.com/PuceLi/susfs4ksu/-/raw/kernel-4.19/kernel_patches/include/linux/susfs_def.h
          patch -p1 < 50_add_susfs_in_kernel-4.19.patch
          echo "SUSFS patches applied successfully!"

      - name: Compile Kernel
        run: |
          mkdir -p out
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== Configuring alioth_defconfig ==="
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 alioth_defconfig

          echo "=== Building Kernel Image, DTBs and DTBO ==="
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 Image dtbs dtbo.img

      - name: Verify Build Output
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi
          echo "Kernel compiled successfully!"
          ls -lh out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/dtbo.img || true

      - name: Package with AnyKernel3
        run: |
          cp -r anykernel ak
          cp out/arch/arm64/boot/Image ak/Image
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img ak/dtbo.img
          fi
          cat out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb > ak/dtb 2>/dev/null || true

          DATE_TAG=$(date +'%Y%m%d-%H%M')
          ZIP_NAME="AliothX-DroidSpaces-alioth-${DATE_TAG}.zip"
          (cd ak && zip -r9 "../${ZIP_NAME}" . -x '*.git*')
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV

      - name: Generate boot.img and vendor_boot.img for APatch
        run: |
          echo "=== Fetching base Android 16 (LineageOS 23.2) boot & vendor_boot ==="
          curl -sSL -o base_boot.img https://mirrorbits.lineageos.org/full/alioth/20260826/boot.img
          curl -sSL -o vendor_boot.img https://mirrorbits.lineageos.org/full/alioth/20260826/vendor_boot.img

          echo "=== Repacking boot.img with new AliothX kernel Image ==="
          mkdir -p boot_repack && cd boot_repack
          magiskboot unpack ../base_boot.img
          cp ../out/arch/arm64/boot/Image kernel
          magiskboot repack ../base_boot.img ../boot.img
          cd ..

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img dtbo.img
          fi

          echo "Listing generated flashable images:"
          ls -lh boot.img vendor_boot.img dtbo.img "${ZIP_NAME}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AliothX-Images-${{ env.DATE_TAG }}
          path: |
            ${{ env.ZIP_NAME }}
            boot.img
            vendor_boot.img
            dtbo.img

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/aosp-16') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ env.DATE_TAG }}
          name: AliothX DroidSpaces (${{ env.DATE_TAG }})
          body: |
            ### AliothX Kernel - POCO F3 / Redmi K40 (alioth)
            - **Base**: Linux 4.19.325 (AOSP 16 / Android 16)
            - **Features**: Full DroidSpaces & LXC Support
              - POSIX message queues & System V IPC
              - Namespaces (PID, UTS, IPC, USER, NET)
              - CGroups v1/v2 (Memory, PIDs, Freezer, Devices, Net Prio)
              - Bridge, VETH, NAT, Netfilter/IPTables/NFTables
              - OverlayFS & POSIX ACL/xattr
              - CGroup file prefix handling patch
            - **Compiler**: Clang r563880c (LLVM 21+)
            
            #### Arquivos inclusos para instalação e APatch:
            1. **`${{ env.ZIP_NAME }}`**: Arquivo zip para instalação direta via Recovery (TWRP / OrangeFox) ou Kernel Flasher.
            2. **`boot.img`**: Imagem de boot contendo o kernel AliothX. **Pronta para aplicar patch com o aplicativo APatch Manager** e instalar via `fastboot flash boot boot.img`.
            3. **`vendor_boot.img`**: Imagem vendor_boot com DTBs atualizados (`fastboot flash vendor_boot vendor_boot.img`).
            4. **`dtbo.img`**: Imagem DTBO (`fastboot flash dtbo dtbo.img`).
          files: |
            ${{ env.ZIP_NAME }}
            boot.img
            vendor_boot.img
            dtbo.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
