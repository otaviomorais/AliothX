name: Build AliothX Kernel (MIUI/HyperOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: aosp-16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            gnupg gperf libelf-dev libncurses5-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip libtinfo5 libncurses5
          which python2 || sudo ln -s $(which python3) /usr/bin/python2

      - name: Clone Clang Toolchain (r563880c)
        run: |
          echo "Cloning AOSP Clang r563880c..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r563880c.git clang
          chmod -R +x clang/bin/

      - name: Setup mkdtboimg
        run: |
          chmod +x scripts/ufdt/libufdt/utils/src/mkdtboimg.py
          sudo ln -sf $(pwd)/scripts/ufdt/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtboimg.py

      - name: Configure Kernel for MIUI Compatibility
        run: |
          echo "Bypassing module CRC and vermagic checks for vendor modules..."
          sed -i 's/return -ENOEXEC;/return 0;/g' kernel/module.c
          sed -i 's/if (!same_magic(modmagic, vermagic, info->index.vers))/if (0)/g' kernel/module.c
          sed -i 's/pr_warn("%s: disagrees about version of symbol/return 1; pr_warn("%s: disagrees about version of symbol/g' kernel/module.c

          echo "Applying MIUI defconfig configuration..."
          # Required for MIUI Android 13/14 cgroup task management
          sed -i 's/# CONFIG_FAIR_GROUP_SCHED is not set/CONFIG_FAIR_GROUP_SCHED=y/g' arch/arm64/configs/alioth_defconfig
          echo "CONFIG_FAIR_GROUP_SCHED=y" >> arch/arm64/configs/alioth_defconfig

          # Disable CFI and Shadow Call Stack to prevent traps with stock vendor modules
          sed -i 's/CONFIG_CFI_CLANG=y/# CONFIG_CFI_CLANG is not set/g' arch/arm64/configs/alioth_defconfig
          sed -i 's/CONFIG_SHADOW_CALL_STACK=y/# CONFIG_SHADOW_CALL_STACK is not set/g' arch/arm64/configs/alioth_defconfig
          echo "# CONFIG_CFI_CLANG is not set" >> arch/arm64/configs/alioth_defconfig
          echo "# CONFIG_SHADOW_CALL_STACK is not set" >> arch/arm64/configs/alioth_defconfig

          # Match standard MIUI vermagic & load settings
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-perf"/g' arch/arm64/configs/alioth_defconfig
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> arch/arm64/configs/alioth_defconfig

      - name: Compile Kernel
        run: |
          mkdir -p out
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== Configuring alioth_defconfig ==="
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 alioth_defconfig

          echo "=== Building Kernel Image, DTBs and DTBO ==="
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 Image dtbs dtbo.img

      - name: Verify Build Output
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi
          echo "Kernel compiled successfully!"
          ls -lh out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/dtbo.img || true

      - name: Package with AnyKernel3
        run: |
          cp -r anykernel ak
          cp out/arch/arm64/boot/Image ak/Image
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img ak/dtbo.img
          fi
          cat out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb > ak/dtb 2>/dev/null || true

          # IMPORTANT FOR MIUI:
          # Do NOT patch vendor_boot on MIUI/HyperOS (corrupts original vendor certs/modules)
          # We remove vendor_boot patching block from anykernel.sh for MIUI package
          sed -i '/vendor_boot shell variables/,$d' ak/anykernel.sh

          DATE_TAG=$(date +'%Y%m%d-%H%M')
          ZIP_NAME="AliothX-MIUI-alioth-${DATE_TAG}.zip"
          (cd ak && zip -r9 "../${ZIP_NAME}" . -x '*.git*')
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV
          ls -lh "${ZIP_NAME}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AliothX-MIUI-${{ env.DATE_TAG }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miui-v${{ env.DATE_TAG }}
          name: AliothX MIUI/HyperOS Edition (${{ env.DATE_TAG }})
          body: |
            ### AliothX Kernel — MIUI 14 / HyperOS Edition
            - **SoC**: Qualcomm Snapdragon 870 5G (SM8250-AC)
            - **Compatibilidade**: Desenvolvido e ajustado sob medida para a ROM Original de fábrica (MIUI 14 / HyperOS).
            - **AnyKernel3 Seguro para MIUI**: Atualiza a partição de boot sem corromper o `vendor_boot` original da MIUI.
            - **Cgroups & Scheduler**: `CONFIG_FAIR_GROUP_SCHED=y` ativado para compatibilidade total com o sistema de cgroups da MIUI.
            - **Módulos do Vendor**: Módulos proprietários (Wi-Fi QCA6390, Áudio WCD/Bolero) protegidos contra pânico de CFI/SCS.
            - **Escalonador**: EEVDF (Earliest Eligible Virtual Deadline First) + CASS.
            - **Compressão**: ZSTD 1.5.7.
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
