name: Build AliothX Kernel (MIUI/HyperOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: aosp-16
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             bc bison build-essential ccache curl flex git             gnupg gperf libelf-dev libncurses5-dev libssl-dev libxml2 libxml2-utils             lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev             python3 python3-pip libtinfo5 libncurses5
          which python2 || sudo ln -s $(which python3) /usr/bin/python2

      - name: Clone Clang Toolchain (r563880c)
        run: |
          echo "Cloning AOSP Clang r563880c..."
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r563880c.git clang
          chmod -R +x clang/bin/

      - name: Setup mkdtboimg
        run: |
          chmod +x scripts/ufdt/libufdt/utils/src/mkdtboimg.py
          sudo ln -sf $(pwd)/scripts/ufdt/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtboimg.py

      - name: Patch Kernel for MIUI ABI & Module Compatibility
        run: |
          echo "Patching kernel/module.c to ignore vermagic checks & CRCs..."
          sed -i 's/return -ENOEXEC;/return 0;/g' kernel/module.c
          sed -i 's/if (!same_magic(modmagic, vermagic, info->index.vers))/if (0)/g' kernel/module.c
          sed -i 's/pr_warn("%s: disagrees about version of symbol/return 1; pr_warn("%s: disagrees about version of symbol/g' kernel/module.c
          
          echo "Restoring full dma-buf, dma-fence & reservation ABI for MIUI proprietary GPU/Display modules..."
          BASE_URL="https://raw.githubusercontent.com/TIMISONG-dev/kernel_xiaomi_sm8250/magictime-miui"
          
          # Download headers
          curl -sL "${BASE_URL}/include/linux/dma-buf.h" -o include/linux/dma-buf.h
          curl -sL "${BASE_URL}/include/linux/dma-fence.h" -o include/linux/dma-fence.h
          curl -sL "${BASE_URL}/include/linux/reservation.h" -o include/linux/reservation.h
          
          # Download drivers
          curl -sL "${BASE_URL}/drivers/dma-buf/dma-buf.c" -o drivers/dma-buf/dma-buf.c
          curl -sL "${BASE_URL}/drivers/dma-buf/dma-fence.c" -o drivers/dma-buf/dma-fence.c
          curl -sL "${BASE_URL}/drivers/dma-buf/reservation.c" -o drivers/dma-buf/reservation.c
          curl -sL "${BASE_URL}/scripts/mkcompile_h" -o scripts/mkcompile_h
          chmod +x scripts/mkcompile_h
          
          # Fix vma_set_file if missing in mm.h
          sed -i 's/vma_set_file(vma, dmabuf->file);/if (vma->vm_file) fput(vma->vm_file); get_file(dmabuf->file); vma->vm_file = dmabuf->file;/g' drivers/dma-buf/dma-buf.c
          
          echo "Applying MIUI defconfig flags..."
          echo "CONFIG_MODULE_FORCE_LOAD=y" >> arch/arm64/configs/alioth_defconfig
          echo "CONFIG_MODVERSIONS=n" >> arch/arm64/configs/alioth_defconfig
          echo "# CONFIG_UDMABUF is not set" >> arch/arm64/configs/alioth_defconfig
          echo 'CONFIG_LOCALVERSION="-perf"' >> arch/arm64/configs/alioth_defconfig
      - name: Compile Kernel
        run: |
          mkdir -p out
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=== Configuring alioth_defconfig ==="
          make O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 alioth_defconfig

          echo "=== Building Kernel Image, DTBs and DTBO ==="
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM=1 LLVM_IAS=1 Image dtbs dtbo.img

      - name: Verify Build Output
        run: |
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "ERROR: Kernel Image not found!"
            exit 1
          fi
          echo "Kernel compiled successfully!"
          ls -lh out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/dtbo.img || true

      - name: Package with AnyKernel3
        run: |
          cp -r anykernel ak
          cp out/arch/arm64/boot/Image ak/Image
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img ak/dtbo.img
          fi
          cat out/arch/arm64/boot/dts/vendor/qcom/kona*.dtb > ak/dtb 2>/dev/null || true

          DATE_TAG=$(date +'%Y%m%d-%H%M')
          ZIP_NAME="AliothX-MIUI-alioth-${DATE_TAG}.zip"
          (cd ak && zip -r9 "../${ZIP_NAME}" . -x '*.git*')
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV
          ls -lh "${ZIP_NAME}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AliothX-MIUI-${{ env.DATE_TAG }}
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miui-v${{ env.DATE_TAG }}
          name: AliothX MIUI/HyperOS Edition (${{ env.DATE_TAG }})
          body: |
            ### AliothX Kernel — MIUI / HyperOS Stock ROM
            - **Compatibilidade**: Feito especificamente para a ROM Original de fábrica (MIUI 14 / HyperOS).
            - **ABI Fix**: Restauração da ABI antiga do `dma-buf` e `udmabuf` para suportar nativamente os módulos proprietários (`adreno.ko`, `qca_cld3.ko`).
            - **Módulos**: Bypass de *Vermagic* ativado.
            - **SoC**: Qualcomm Snapdragon 870 5G (SM8250-AC)
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
